# JDBC and JPA: Use PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${FITBIT_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${FITBIT_DATASOURCE_USERNAME}
quarkus.datasource.password=${FITBIT_DATASOURCE_PASSWORD}
quarkus.hibernate-orm.database.generation=validate

# HTTP Server
quarkus.http.root-path=/fitbit

# REST Client
quarkus.rest-client.auth-api.url=https://oauth2.googleapis.com
quarkus.openapi-generator.codegen.spec.health_v4_json.base-package=com.google.api.health.v4
# TODO: is there an alternative for additional-request-args? Change Spec? Use implicit context?
quarkus.openapi-generator.codegen.spec.health_v4_json.additional-request-args=@jakarta.ws.rs.HeaderParam("Authorization") String authorization
# TODO: is there an alternative for additional-api-type-annotations? Change Spec? Beware that it applies to all path/query/form/matrix params!
quarkus.openapi-generator.codegen.spec.health_v4_json.additional-api-type-annotations=@jakarta.ws.rs.Encoded

# Log Levels
quarkus.log.category."com.github.phoswald.fitbit.viewer".level=DEBUG
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
#quarkus.rest-client.logging.scope=request-response
#quarkus.rest-client.logging.body-limit=10000

# Application: FitBit API
app.fitbit.client-id=${FITBIT_CLIENT_ID}
app.fitbit.client-secret=${FITBIT_CLIENT_SECRET}
app.fitbit.redirect-uri=${FITBIT_REDIRECT_URI}
app.fitbit.cookie.secret=${FITBIT_COOKIE_SECRET}
