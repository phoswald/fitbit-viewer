# JDBC and JPA: H2
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.database.generation=update

# Application: FitBit API
app.fitbit.client-id=test-client-id
app.fitbit.client-secret=test-client-secret
app.fitbit.redirect-uri=http://localhost/test
app.fitbit.cookie.secret=test-cookie-secret

# REST Client: Google Health API (mocked by WireMock Dev Services)
quarkus.rest-client.health_v4_json.url=http://localhost:${quarkus.wiremock.devservices.port}
